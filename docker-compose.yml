services:
  postgres:
    image: postgres:15-alpine
    container_name: psychology_lab_db
    environment:
      POSTGRES_DB: psychology_lab
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-BMLab_secure_test_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - lab_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d psychology_lab"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psychology_lab_api
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://labuser:${POSTGRES_PASSWORD:-BMLab_secure_test_password}@postgres:5432/psychology_lab
      JWT_SECRET: ${JWT_SECRET:-rV6P!cZ5@qG9#tL1^dX0*BfW8Yh%NsKu}
    ports:
      - "3002:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lab_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: psychology_lab_frontend
    environment:
      REACT_APP_API_URL: http://localhost:3002
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - lab_network
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: psychology_lab_adminer
    ports:
      - "8080:8080"
    networks:
      - lab_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  lab_network:
    driver: bridge
